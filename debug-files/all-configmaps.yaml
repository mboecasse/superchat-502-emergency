- apiVersion: v1
  data:
    inject-user-management.js: |
      // Script to inject user management functionality
      (function() {
        console.log('Loading User Management integration...');

        // Load the user management script dynamically
        const script = document.createElement('script');
        script.src = '/api/user-management/client.js';
        script.onload = function() {
          console.log('User Management script loaded successfully');
          // Initialize user management if the class exists
          if (typeof UserManagement !== 'undefined') {
            window.userManagement = new UserManagement();
            window.userManagement.init();
          }
        };
        script.onerror = function() {
          console.warn('User Management script could not be loaded');
        };
        document.head.appendChild(script);
      })();
    user-management-client.js: |
      // User Management Client Integration
      class UserManagement {
        constructor() {
          this.apiUrl = '/api/user-management';
          this.currentUser = null;
          this.users = [];
          this.stats = {};
          this.initialized = false;
        }

        async init() {
          if (this.initialized) return;

          try {
            console.log('Initializing User Management...');
            await this.loadCurrentUser();

            if (this.currentUser && this.currentUser.role === 'super_admin') {
              await this.loadStats();
              await this.loadUsers();
              this.injectSettingsTab();
              console.log('User Management initialized for super admin');
            } else {
              console.log('User Management: Not a super admin, skipping UI injection');
            }

            this.initialized = true;
          } catch (error) {
            console.error('User management init failed:', error);
          }
        }

        async loadCurrentUser() {
          try {
            // Get current user info from the API using OAuth headers
            const response = await fetch('/api/user-management/auth/me', {
              credentials: 'include',
              headers: {
                'X-Requested-With': 'XMLHttpRequest'
              }
            });

            if (response.ok) {
              this.currentUser = await response.json();
            } else {
              // Simulate getting user from OAuth headers if endpoint doesn't exist yet
              // This will be replaced when the /auth/me endpoint is implemented
              this.currentUser = {
                email: 'mboecasse@gmail.com', // Default for testing
                role: 'super_admin'
              };
            }
          } catch (error) {
            console.warn('Could not load current user:', error);
            // Fallback - assume super admin for now
            this.currentUser = {
              email: 'mboecasse@gmail.com',
              role: 'super_admin'
            };
          }
        }

        async apiCall(endpoint, options = {}) {
          const response = await fetch(`${this.apiUrl}${endpoint}`, {
            ...options,
            headers: {
              'Content-Type': 'application/json',
              'X-Requested-With': 'XMLHttpRequest',
              ...options.headers
            },
            credentials: 'include'
          });

          if (!response.ok) {
            throw new Error(`API call failed: ${response.statusText}`);
          }

          return response.json();
        }

        async loadUsers() {
          try {
            this.users = await this.apiCall('/admin/users');
          } catch (error) {
            console.error('Failed to load users:', error);
          }
        }

        async loadStats() {
          try {
            this.stats = await this.apiCall('/admin/stats');
          } catch (error) {
            console.error('Failed to load stats:', error);
          }
        }

        injectSettingsTab() {
          // Wait for the settings modal to exist and inject user management
          const waitForSettings = () => {
            // Look for common settings selectors
            const settingsSelectors = [
              '[data-testid="settings"]',
              '.settings-modal',
              '.settings-panel',
              'button[aria-label*="settings" i]',
              'button[title*="settings" i]',
              '.settings-button',
              '[role="dialog"]'
            ];

            let settingsElement = null;
            for (const selector of settingsSelectors) {
              settingsElement = document.querySelector(selector);
              if (settingsElement) break;
            }

            if (settingsElement) {
              this.enhanceSettings(settingsElement);
            } else {
              // If settings not found, observe for dynamic content
              this.observeForSettings();
            }
          };

          // Try immediately
          waitForSettings();

          // Also try after a delay in case UI is still loading
          setTimeout(waitForSettings, 2000);
        }

        observeForSettings() {
          const observer = new MutationObserver((mutations) => {
            mutations.forEach((mutation) => {
              mutation.addedNodes.forEach((node) => {
                if (node.nodeType === 1) {
                  // Check if this node or its children contain settings
                  const settingsElement = node.querySelector && (
                    node.querySelector('.settings-modal') ||
                    node.querySelector('[role="dialog"]') ||
                    (node.classList && node.classList.contains('settings-modal'))
                  );

                  if (settingsElement) {
                    this.enhanceSettings(settingsElement);
                    observer.disconnect(); // Stop observing once found
                  }
                }
              });
            });
          });

          observer.observe(document.body, {
            childList: true,
            subtree: true
          });

          // Stop observing after 30 seconds
          setTimeout(() => observer.disconnect(), 30000);
        }

        enhanceSettings(settingsContainer) {
          if (settingsContainer.querySelector('#user-management-tab')) {
            return; // Already enhanced
          }

          console.log('Enhancing settings with user management...');

          // Create user management tab and content
          this.createUserManagementTab(settingsContainer);
        }

        createUserManagementTab(container) {
          // Find or create tab navigation
          let tabNav = container.querySelector('.tab-nav, .tabs, nav');
          if (!tabNav) {
            tabNav = document.createElement('nav');
            tabNav.className = 'border-b border-gray-200 mb-4';
            container.insertBefore(tabNav, container.firstChild);
          }

          // Add user management tab
          const userMgmtTab = document.createElement('button');
          userMgmtTab.id = 'user-management-tab';
          userMgmtTab.className = 'px-4 py-2 text-sm font-medium text-gray-500 hover:text-gray-700 border-b-2 border-transparent hover:border-gray-300';
          userMgmtTab.textContent = 'User Management';
          userMgmtTab.onclick = () => this.showUserManagement();

          tabNav.appendChild(userMgmtTab);

          // Create user management content panel
          this.createUserManagementPanel(container);
        }

        createUserManagementPanel(container) {
          const panel = document.createElement('div');
          panel.id = 'user-management-panel';
          panel.className = 'hidden space-y-6';
          panel.innerHTML = this.getUserManagementHTML();

          container.appendChild(panel);

          // Setup event handlers
          this.setupEventHandlers(panel);

          // Populate initial data
          this.populateUserManagement();
        }

        getUserManagementHTML() {
          return `
            <div class="space-y-6">
              <!-- Stats Cards -->
              <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
                <div class="bg-blue-50 rounded-lg p-4">
                  <h3 class="text-sm font-medium text-blue-700">Total Users</h3>
                  <p class="text-2xl font-bold text-blue-900" id="stat-total">0</p>
                </div>
                <div class="bg-green-50 rounded-lg p-4">
                  <h3 class="text-sm font-medium text-green-700">Active</h3>
                  <p class="text-2xl font-bold text-green-900" id="stat-active">0</p>
                </div>
                <div class="bg-orange-50 rounded-lg p-4">
                  <h3 class="text-sm font-medium text-orange-700">Pending</h3>
                  <p class="text-2xl font-bold text-orange-900" id="stat-pending">0</p>
                </div>
                <div class="bg-purple-50 rounded-lg p-4">
                  <h3 class="text-sm font-medium text-purple-700">Developers</h3>
                  <p class="text-2xl font-bold text-purple-900" id="stat-developers">0</p>
                </div>
              </div>

              <!-- Users Table -->
              <div class="bg-white border rounded-lg overflow-hidden">
                <div class="px-4 py-3 border-b border-gray-200 flex justify-between items-center">
                  <h3 class="text-lg font-medium text-gray-900">Users</h3>
                  <button id="refresh-users" class="text-sm bg-blue-500 text-white px-3 py-1 rounded hover:bg-blue-600">
                    Refresh
                  </button>
                </div>
                <div class="overflow-x-auto max-h-96">
                  <table class="w-full">
                    <thead class="bg-gray-50 sticky top-0">
                      <tr>
                        <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">Email</th>
                        <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">Name</th>
                        <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">Role</th>
                        <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">Status</th>
                        <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">Actions</th>
                      </tr>
                    </thead>
                    <tbody id="users-table-body" class="divide-y divide-gray-200">
                      <!-- Users will be populated here -->
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          `;
        }

        showUserManagement() {
          // Hide other panels
          const panels = document.querySelectorAll('.settings-panel, .tab-content');
          panels.forEach(panel => panel.classList.add('hidden'));

          // Show user management panel
          const userMgmtPanel = document.getElementById('user-management-panel');
          if (userMgmtPanel) {
            userMgmtPanel.classList.remove('hidden');
          }

          // Update tab styles
          const tabs = document.querySelectorAll('.tab-nav button, .tabs button');
          tabs.forEach(tab => {
            tab.classList.remove('border-blue-500', 'text-blue-600');
            tab.classList.add('border-transparent', 'text-gray-500');
          });

          const userMgmtTab = document.getElementById('user-management-tab');
          if (userMgmtTab) {
            userMgmtTab.classList.add('border-blue-500', 'text-blue-600');
            userMgmtTab.classList.remove('border-transparent', 'text-gray-500');
          }
        }

        setupEventHandlers(panel) {
          // Refresh button
          const refreshBtn = panel.querySelector('#refresh-users');
          if (refreshBtn) {
            refreshBtn.onclick = async () => {
              await this.loadUsers();
              await this.loadStats();
              this.populateUserManagement();
            };
          }

          // User role/status changes
          panel.addEventListener('change', async (e) => {
            if (e.target.classList.contains('user-role') || e.target.classList.contains('user-status')) {
              const userId = e.target.getAttribute('data-user-id');
              const user = this.users.find(u => u.id == userId);

              if (!user) return;

              if (e.target.classList.contains('user-role')) {
                user.role = e.target.value;
              } else {
                user.status = e.target.value;
              }

              try {
                await this.apiCall(`/admin/users/${userId}`, {
                  method: 'PUT',
                  body: JSON.stringify({
                    role: user.role,
                    status: user.status,
                    full_name: user.full_name
                  })
                });

                this.showNotification('User updated successfully', 'success');
                await this.loadStats();
                this.updateStats();
              } catch (error) {
                console.error('Failed to update user:', error);
                this.showNotification('Failed to update user', 'error');
                await this.loadUsers();
                this.populateUserManagement();
              }
            }
          });

          // Delete user
          panel.addEventListener('click', async (e) => {
            if (e.target.classList.contains('delete-user')) {
              const userId = e.target.getAttribute('data-user-id');
              const user = this.users.find(u => u.id == userId);

              if (!user || user.id === this.currentUser?.id) return;

              if (!confirm(`Are you sure you want to delete ${user.email}?`)) return;

              try {
                await this.apiCall(`/admin/users/${userId}`, {
                  method: 'DELETE'
                });

                this.showNotification('User deleted successfully', 'success');
                await this.loadUsers();
                await this.loadStats();
                this.populateUserManagement();
              } catch (error) {
                console.error('Failed to delete user:', error);
                this.showNotification('Failed to delete user', 'error');
              }
            }
          });
        }

        populateUserManagement() {
          this.updateStats();
          this.populateUsersTable();
        }

        updateStats() {
          const elements = {
            'stat-total': this.stats.total_users || 0,
            'stat-active': this.stats.active_users || 0,
            'stat-pending': this.stats.pending_users || 0,
            'stat-developers': this.stats.developers || 0
          };

          Object.entries(elements).forEach(([id, value]) => {
            const el = document.getElementById(id);
            if (el) el.textContent = value;
          });
        }

        populateUsersTable() {
          const tbody = document.getElementById('users-table-body');
          if (!tbody || !this.users.length) return;

          tbody.innerHTML = this.users.map(user => `
            <tr>
              <td class="px-4 py-2 text-sm text-gray-900">${user.email}</td>
              <td class="px-4 py-2 text-sm text-gray-900">${user.full_name || '-'}</td>
              <td class="px-4 py-2">
                <select class="user-role text-sm border rounded px-2 py-1" data-user-id="${user.id}">
                  <option value="pending" ${user.role === 'pending' ? 'selected' : ''}>Pending</option>
                  <option value="family" ${user.role === 'family' ? 'selected' : ''}>Family</option>
                  <option value="developer" ${user.role === 'developer' ? 'selected' : ''}>Developer</option>
                  <option value="super_admin" ${user.role === 'super_admin' ? 'selected' : ''}>Super Admin</option>
                </select>
              </td>
              <td class="px-4 py-2">
                <select class="user-status text-sm border rounded px-2 py-1" data-user-id="${user.id}">
                  <option value="pending" ${user.status === 'pending' ? 'selected' : ''}>Pending</option>
                  <option value="active" ${user.status === 'active' ? 'selected' : ''}>Active</option>
                  <option value="suspended" ${user.status === 'suspended' ? 'selected' : ''}>Suspended</option>
                </select>
              </td>
              <td class="px-4 py-2">
                <button class="delete-user text-xs bg-red-500 text-white px-2 py-1 rounded hover:bg-red-600"
                        data-user-id="${user.id}"
                        ${user.id === this.currentUser?.id ? 'disabled' : ''}>
                  Delete
                </button>
              </td>
            </tr>
          `).join('');
        }

        showNotification(message, type = 'info') {
          const notification = document.createElement('div');
          const colors = {
            success: 'bg-green-500 text-white',
            error: 'bg-red-500 text-white',
            info: 'bg-blue-500 text-white'
          };

          notification.className = `fixed top-4 right-4 px-4 py-2 rounded shadow-lg z-50 ${colors[type]}`;
          notification.textContent = message;
          document.body.appendChild(notification);

          setTimeout(() => notification.remove(), 3000);
        }
      }

      // Auto-initialize when DOM is ready
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', () => {
          window.userManagement = new UserManagement();
          window.userManagement.init();
        });
      } else {
        window.userManagement = new UserManagement();
        window.userManagement.init();
      }
  kind: ConfigMap
  metadata:
    annotations:
      kubectl.kubernetes.io/last-applied-configuration: |
        {"apiVersion":"v1","data":{"inject-user-management.js":"// Script to inject user management functionality\n(function() {\n  console.log('Loading User Management integration...');\n\n  // Load the user management script dynamically\n  const script = document.createElement('script');\n  script.src = '/api/user-management/client.js';\n  script.onload = function() {\n    console.log('User Management script loaded successfully');\n    // Initialize user management if the class exists\n    if (typeof UserManagement !== 'undefined') {\n      window.userManagement = new UserManagement();\n      window.userManagement.init();\n    }\n  };\n  script.onerror = function() {\n    console.warn('User Management script could not be loaded');\n  };\n  document.head.appendChild(script);\n})();\n","user-management-client.js":"// User Management Client Integration\nclass UserManagement {\n  constructor() {\n    this.apiUrl = '/api/user-management';\n    this.currentUser = null;\n    this.users = [];\n    this.stats = {};\n    this.initialized = false;\n  }\n\n  async init() {\n    if (this.initialized) return;\n\n    try {\n      console.log('Initializing User Management...');\n      await this.loadCurrentUser();\n\n      if (this.currentUser \u0026\u0026 this.currentUser.role === 'super_admin') {\n        await this.loadStats();\n        await this.loadUsers();\n        this.injectSettingsTab();\n        console.log('User Management initialized for super admin');\n      } else {\n        console.log('User Management: Not a super admin, skipping UI injection');\n      }\n\n      this.initialized = true;\n    } catch (error) {\n      console.error('User management init failed:', error);\n    }\n  }\n\n  async loadCurrentUser() {\n    try {\n      // Get current user info from the API using OAuth headers\n      const response = await fetch('/api/user-management/auth/me', {\n        credentials: 'include',\n        headers: {\n          'X-Requested-With': 'XMLHttpRequest'\n        }\n      });\n\n      if (response.ok) {\n        this.currentUser = await response.json();\n      } else {\n        // Simulate getting user from OAuth headers if endpoint doesn't exist yet\n        // This will be replaced when the /auth/me endpoint is implemented\n        this.currentUser = {\n          email: 'mboecasse@gmail.com', // Default for testing\n          role: 'super_admin'\n        };\n      }\n    } catch (error) {\n      console.warn('Could not load current user:', error);\n      // Fallback - assume super admin for now\n      this.currentUser = {\n        email: 'mboecasse@gmail.com',\n        role: 'super_admin'\n      };\n    }\n  }\n\n  async apiCall(endpoint, options = {}) {\n    const response = await fetch(`${this.apiUrl}${endpoint}`, {\n      ...options,\n      headers: {\n        'Content-Type': 'application/json',\n        'X-Requested-With': 'XMLHttpRequest',\n        ...options.headers\n      },\n      credentials: 'include'\n    });\n\n    if (!response.ok) {\n      throw new Error(`API call failed: ${response.statusText}`);\n    }\n\n    return response.json();\n  }\n\n  async loadUsers() {\n    try {\n      this.users = await this.apiCall('/admin/users');\n    } catch (error) {\n      console.error('Failed to load users:', error);\n    }\n  }\n\n  async loadStats() {\n    try {\n      this.stats = await this.apiCall('/admin/stats');\n    } catch (error) {\n      console.error('Failed to load stats:', error);\n    }\n  }\n\n  injectSettingsTab() {\n    // Wait for the settings modal to exist and inject user management\n    const waitForSettings = () =\u003e {\n      // Look for common settings selectors\n      const settingsSelectors = [\n        '[data-testid=\"settings\"]',\n        '.settings-modal',\n        '.settings-panel',\n        'button[aria-label*=\"settings\" i]',\n        'button[title*=\"settings\" i]',\n        '.settings-button',\n        '[role=\"dialog\"]'\n      ];\n\n      let settingsElement = null;\n      for (const selector of settingsSelectors) {\n        settingsElement = document.querySelector(selector);\n        if (settingsElement) break;\n      }\n\n      if (settingsElement) {\n        this.enhanceSettings(settingsElement);\n      } else {\n        // If settings not found, observe for dynamic content\n        this.observeForSettings();\n      }\n    };\n\n    // Try immediately\n    waitForSettings();\n\n    // Also try after a delay in case UI is still loading\n    setTimeout(waitForSettings, 2000);\n  }\n\n  observeForSettings() {\n    const observer = new MutationObserver((mutations) =\u003e {\n      mutations.forEach((mutation) =\u003e {\n        mutation.addedNodes.forEach((node) =\u003e {\n          if (node.nodeType === 1) {\n            // Check if this node or its children contain settings\n            const settingsElement = node.querySelector \u0026\u0026 (\n              node.querySelector('.settings-modal') ||\n              node.querySelector('[role=\"dialog\"]') ||\n              (node.classList \u0026\u0026 node.classList.contains('settings-modal'))\n            );\n\n            if (settingsElement) {\n              this.enhanceSettings(settingsElement);\n              observer.disconnect(); // Stop observing once found\n            }\n          }\n        });\n      });\n    });\n\n    observer.observe(document.body, {\n      childList: true,\n      subtree: true\n    });\n\n    // Stop observing after 30 seconds\n    setTimeout(() =\u003e observer.disconnect(), 30000);\n  }\n\n  enhanceSettings(settingsContainer) {\n    if (settingsContainer.querySelector('#user-management-tab')) {\n      return; // Already enhanced\n    }\n\n    console.log('Enhancing settings with user management...');\n\n    // Create user management tab and content\n    this.createUserManagementTab(settingsContainer);\n  }\n\n  createUserManagementTab(container) {\n    // Find or create tab navigation\n    let tabNav = container.querySelector('.tab-nav, .tabs, nav');\n    if (!tabNav) {\n      tabNav = document.createElement('nav');\n      tabNav.className = 'border-b border-gray-200 mb-4';\n      container.insertBefore(tabNav, container.firstChild);\n    }\n\n    // Add user management tab\n    const userMgmtTab = document.createElement('button');\n    userMgmtTab.id = 'user-management-tab';\n    userMgmtTab.className = 'px-4 py-2 text-sm font-medium text-gray-500 hover:text-gray-700 border-b-2 border-transparent hover:border-gray-300';\n    userMgmtTab.textContent = 'User Management';\n    userMgmtTab.onclick = () =\u003e this.showUserManagement();\n\n    tabNav.appendChild(userMgmtTab);\n\n    // Create user management content panel\n    this.createUserManagementPanel(container);\n  }\n\n  createUserManagementPanel(container) {\n    const panel = document.createElement('div');\n    panel.id = 'user-management-panel';\n    panel.className = 'hidden space-y-6';\n    panel.innerHTML = this.getUserManagementHTML();\n\n    container.appendChild(panel);\n\n    // Setup event handlers\n    this.setupEventHandlers(panel);\n\n    // Populate initial data\n    this.populateUserManagement();\n  }\n\n  getUserManagementHTML() {\n    return `\n      \u003cdiv class=\"space-y-6\"\u003e\n        \u003c!-- Stats Cards --\u003e\n        \u003cdiv class=\"grid grid-cols-2 lg:grid-cols-4 gap-4\"\u003e\n          \u003cdiv class=\"bg-blue-50 rounded-lg p-4\"\u003e\n            \u003ch3 class=\"text-sm font-medium text-blue-700\"\u003eTotal Users\u003c/h3\u003e\n            \u003cp class=\"text-2xl font-bold text-blue-900\" id=\"stat-total\"\u003e0\u003c/p\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"bg-green-50 rounded-lg p-4\"\u003e\n            \u003ch3 class=\"text-sm font-medium text-green-700\"\u003eActive\u003c/h3\u003e\n            \u003cp class=\"text-2xl font-bold text-green-900\" id=\"stat-active\"\u003e0\u003c/p\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"bg-orange-50 rounded-lg p-4\"\u003e\n            \u003ch3 class=\"text-sm font-medium text-orange-700\"\u003ePending\u003c/h3\u003e\n            \u003cp class=\"text-2xl font-bold text-orange-900\" id=\"stat-pending\"\u003e0\u003c/p\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"bg-purple-50 rounded-lg p-4\"\u003e\n            \u003ch3 class=\"text-sm font-medium text-purple-700\"\u003eDevelopers\u003c/h3\u003e\n            \u003cp class=\"text-2xl font-bold text-purple-900\" id=\"stat-developers\"\u003e0\u003c/p\u003e\n          \u003c/div\u003e\n        \u003c/div\u003e\n\n        \u003c!-- Users Table --\u003e\n        \u003cdiv class=\"bg-white border rounded-lg overflow-hidden\"\u003e\n          \u003cdiv class=\"px-4 py-3 border-b border-gray-200 flex justify-between items-center\"\u003e\n            \u003ch3 class=\"text-lg font-medium text-gray-900\"\u003eUsers\u003c/h3\u003e\n            \u003cbutton id=\"refresh-users\" class=\"text-sm bg-blue-500 text-white px-3 py-1 rounded hover:bg-blue-600\"\u003e\n              Refresh\n            \u003c/button\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"overflow-x-auto max-h-96\"\u003e\n            \u003ctable class=\"w-full\"\u003e\n              \u003cthead class=\"bg-gray-50 sticky top-0\"\u003e\n                \u003ctr\u003e\n                  \u003cth class=\"px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase\"\u003eEmail\u003c/th\u003e\n                  \u003cth class=\"px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase\"\u003eName\u003c/th\u003e\n                  \u003cth class=\"px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase\"\u003eRole\u003c/th\u003e\n                  \u003cth class=\"px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase\"\u003eStatus\u003c/th\u003e\n                  \u003cth class=\"px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase\"\u003eActions\u003c/th\u003e\n                \u003c/tr\u003e\n              \u003c/thead\u003e\n              \u003ctbody id=\"users-table-body\" class=\"divide-y divide-gray-200\"\u003e\n                \u003c!-- Users will be populated here --\u003e\n              \u003c/tbody\u003e\n            \u003c/table\u003e\n          \u003c/div\u003e\n        \u003c/div\u003e\n      \u003c/div\u003e\n    `;\n  }\n\n  showUserManagement() {\n    // Hide other panels\n    const panels = document.querySelectorAll('.settings-panel, .tab-content');\n    panels.forEach(panel =\u003e panel.classList.add('hidden'));\n\n    // Show user management panel\n    const userMgmtPanel = document.getElementById('user-management-panel');\n    if (userMgmtPanel) {\n      userMgmtPanel.classList.remove('hidden');\n    }\n\n    // Update tab styles\n    const tabs = document.querySelectorAll('.tab-nav button, .tabs button');\n    tabs.forEach(tab =\u003e {\n      tab.classList.remove('border-blue-500', 'text-blue-600');\n      tab.classList.add('border-transparent', 'text-gray-500');\n    });\n\n    const userMgmtTab = document.getElementById('user-management-tab');\n    if (userMgmtTab) {\n      userMgmtTab.classList.add('border-blue-500', 'text-blue-600');\n      userMgmtTab.classList.remove('border-transparent', 'text-gray-500');\n    }\n  }\n\n  setupEventHandlers(panel) {\n    // Refresh button\n    const refreshBtn = panel.querySelector('#refresh-users');\n    if (refreshBtn) {\n      refreshBtn.onclick = async () =\u003e {\n        await this.loadUsers();\n        await this.loadStats();\n        this.populateUserManagement();\n      };\n    }\n\n    // User role/status changes\n    panel.addEventListener('change', async (e) =\u003e {\n      if (e.target.classList.contains('user-role') || e.target.classList.contains('user-status')) {\n        const userId = e.target.getAttribute('data-user-id');\n        const user = this.users.find(u =\u003e u.id == userId);\n\n        if (!user) return;\n\n        if (e.target.classList.contains('user-role')) {\n          user.role = e.target.value;\n        } else {\n          user.status = e.target.value;\n        }\n\n        try {\n          await this.apiCall(`/admin/users/${userId}`, {\n            method: 'PUT',\n            body: JSON.stringify({\n              role: user.role,\n              status: user.status,\n              full_name: user.full_name\n            })\n          });\n\n          this.showNotification('User updated successfully', 'success');\n          await this.loadStats();\n          this.updateStats();\n        } catch (error) {\n          console.error('Failed to update user:', error);\n          this.showNotification('Failed to update user', 'error');\n          await this.loadUsers();\n          this.populateUserManagement();\n        }\n      }\n    });\n\n    // Delete user\n    panel.addEventListener('click', async (e) =\u003e {\n      if (e.target.classList.contains('delete-user')) {\n        const userId = e.target.getAttribute('data-user-id');\n        const user = this.users.find(u =\u003e u.id == userId);\n\n        if (!user || user.id === this.currentUser?.id) return;\n\n        if (!confirm(`Are you sure you want to delete ${user.email}?`)) return;\n\n        try {\n          await this.apiCall(`/admin/users/${userId}`, {\n            method: 'DELETE'\n          });\n\n          this.showNotification('User deleted successfully', 'success');\n          await this.loadUsers();\n          await this.loadStats();\n          this.populateUserManagement();\n        } catch (error) {\n          console.error('Failed to delete user:', error);\n          this.showNotification('Failed to delete user', 'error');\n        }\n      }\n    });\n  }\n\n  populateUserManagement() {\n    this.updateStats();\n    this.populateUsersTable();\n  }\n\n  updateStats() {\n    const elements = {\n      'stat-total': this.stats.total_users || 0,\n      'stat-active': this.stats.active_users || 0,\n      'stat-pending': this.stats.pending_users || 0,\n      'stat-developers': this.stats.developers || 0\n    };\n\n    Object.entries(elements).forEach(([id, value]) =\u003e {\n      const el = document.getElementById(id);\n      if (el) el.textContent = value;\n    });\n  }\n\n  populateUsersTable() {\n    const tbody = document.getElementById('users-table-body');\n    if (!tbody || !this.users.length) return;\n\n    tbody.innerHTML = this.users.map(user =\u003e `\n      \u003ctr\u003e\n        \u003ctd class=\"px-4 py-2 text-sm text-gray-900\"\u003e${user.email}\u003c/td\u003e\n        \u003ctd class=\"px-4 py-2 text-sm text-gray-900\"\u003e${user.full_name || '-'}\u003c/td\u003e\n        \u003ctd class=\"px-4 py-2\"\u003e\n          \u003cselect class=\"user-role text-sm border rounded px-2 py-1\" data-user-id=\"${user.id}\"\u003e\n            \u003coption value=\"pending\" ${user.role === 'pending' ? 'selected' : ''}\u003ePending\u003c/option\u003e\n            \u003coption value=\"family\" ${user.role === 'family' ? 'selected' : ''}\u003eFamily\u003c/option\u003e\n            \u003coption value=\"developer\" ${user.role === 'developer' ? 'selected' : ''}\u003eDeveloper\u003c/option\u003e\n            \u003coption value=\"super_admin\" ${user.role === 'super_admin' ? 'selected' : ''}\u003eSuper Admin\u003c/option\u003e\n          \u003c/select\u003e\n        \u003c/td\u003e\n        \u003ctd class=\"px-4 py-2\"\u003e\n          \u003cselect class=\"user-status text-sm border rounded px-2 py-1\" data-user-id=\"${user.id}\"\u003e\n            \u003coption value=\"pending\" ${user.status === 'pending' ? 'selected' : ''}\u003ePending\u003c/option\u003e\n            \u003coption value=\"active\" ${user.status === 'active' ? 'selected' : ''}\u003eActive\u003c/option\u003e\n            \u003coption value=\"suspended\" ${user.status === 'suspended' ? 'selected' : ''}\u003eSuspended\u003c/option\u003e\n          \u003c/select\u003e\n        \u003c/td\u003e\n        \u003ctd class=\"px-4 py-2\"\u003e\n          \u003cbutton class=\"delete-user text-xs bg-red-500 text-white px-2 py-1 rounded hover:bg-red-600\"\n                  data-user-id=\"${user.id}\"\n                  ${user.id === this.currentUser?.id ? 'disabled' : ''}\u003e\n            Delete\n          \u003c/button\u003e\n        \u003c/td\u003e\n      \u003c/tr\u003e\n    `).join('');\n  }\n\n  showNotification(message, type = 'info') {\n    const notification = document.createElement('div');\n    const colors = {\n      success: 'bg-green-500 text-white',\n      error: 'bg-red-500 text-white',\n      info: 'bg-blue-500 text-white'\n    };\n\n    notification.className = `fixed top-4 right-4 px-4 py-2 rounded shadow-lg z-50 ${colors[type]}`;\n    notification.textContent = message;\n    document.body.appendChild(notification);\n\n    setTimeout(() =\u003e notification.remove(), 3000);\n  }\n}\n\n// Auto-initialize when DOM is ready\nif (document.readyState === 'loading') {\n  document.addEventListener('DOMContentLoaded', () =\u003e {\n    window.userManagement = new UserManagement();\n    window.userManagement.init();\n  });\n} else {\n  window.userManagement = new UserManagement();\n  window.userManagement.init();\n}\n"},"kind":"ConfigMap","metadata":{"annotations":{},"name":"superchat-frontend-patch","namespace":"development"}}
