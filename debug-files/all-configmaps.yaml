- apiVersion: v1
  data:
    check-and-shutdown.sh: "#!/bin/bash\n\n# Auto-shutdown script for Code Server
      pods\n# Checks for idle time and scales down deployment to save costs\n\nNAMESPACE=\"development\"\nDEPLOYMENT=\"code-server-claude\"\nIDLE_THRESHOLD_MINUTES=240
      \ # 4 hours\n\necho \"\U0001F50D Checking Code Server activity...\"\n\n# Get
      pod name\nPOD_NAME=$(kubectl get pods -n $NAMESPACE -l app=code-server-claude
      -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)\n\nif [ -z \"$POD_NAME\"
      ]; then\n  echo \"No Code Server pod found. Exiting.\"\n  exit 0\nfi\n\n# Check
      last access time by examining logs\nLAST_LOG_TIME=$(kubectl logs -n $NAMESPACE
      $POD_NAME --tail=100 2>/dev/null | grep -E \"GET|POST\" | tail -1 | awk '{print
      $1\" \"$2}' | tr -d '[]')\n\nif [ -z \"$LAST_LOG_TIME\" ]; then\n  echo \"No
      activity logs found. Checking pod age...\"\n  # If no logs, check pod creation
      time\n  POD_AGE_SECONDS=$(kubectl get pod -n $NAMESPACE $POD_NAME -o jsonpath='{.metadata.creationTimestamp}'
      | xargs -I {} date -d {} +%s | xargs -I {} echo \"$(date +%s) - {}\" | bc)\n
      \ POD_AGE_MINUTES=$((POD_AGE_SECONDS / 60))\n\n  if [ $POD_AGE_MINUTES -gt $IDLE_THRESHOLD_MINUTES
      ]; then\n    echo \"⏰ Pod has been running for $POD_AGE_MINUTES minutes with
      no activity.\"\n    echo \"\U0001F4A4 Scaling down deployment to save costs...\"\n
      \   kubectl scale deployment/$DEPLOYMENT -n $NAMESPACE --replicas=0\n    echo
      \"✅ Code Server scaled down. It will restart on next access.\"\n  else\n    echo
      \"✅ Pod is only $POD_AGE_MINUTES minutes old. Still within active period.\"\n
      \ fi\nelse\n  # Calculate time since last activity\n  CURRENT_TIME=$(date +%s)\n
      \ LAST_ACTIVITY=$(date -d \"$LAST_LOG_TIME\" +%s 2>/dev/null || echo $CURRENT_TIME)\n
      \ IDLE_SECONDS=$((CURRENT_TIME - LAST_ACTIVITY))\n  IDLE_MINUTES=$((IDLE_SECONDS
      / 60))\n\n  echo \"Last activity: $LAST_LOG_TIME (${IDLE_MINUTES} minutes ago)\"\n\n
      \ if [ $IDLE_MINUTES -gt $IDLE_THRESHOLD_MINUTES ]; then\n    echo \"⏰ Idle
      threshold exceeded ($IDLE_MINUTES > $IDLE_THRESHOLD_MINUTES minutes)\"\n    echo
      \"\U0001F4A4 Scaling down deployment to save costs...\"\n    kubectl scale deployment/$DEPLOYMENT
      -n $NAMESPACE --replicas=0\n    echo \"✅ Code Server scaled down. It will restart
      on next access.\"\n  else\n    echo \"✅ Code Server is active. No action needed.\"\n
      \ fi\nfi\n"
