  data:
    user-management-loader.js: "/**\n * VISIBLE DEBUG VERSION - Creates a yellow panel
      to show what's happening\n */\n\n(function() {\n    const DEBUG_PREFIX = '%c[UM-VISIBLE-DEBUG]';\n
      \   const DEBUG_STYLE = 'color: red; font-weight: bold; font-size: 14px;';\n\n
      \   console.log(DEBUG_PREFIX, DEBUG_STYLE, 'Script executing at:', new Date().toISOString());\n
      \   console.log(DEBUG_PREFIX, DEBUG_STYLE, 'Page URL:', window.location.href);\n\n
      \   // Create visible debug panel immediately\n    function createDebugPanel()
      {\n        // Remove any existing panel\n        const existing = document.getElementById('um-debug-panel');\n
      \       if (existing) existing.remove();\n\n        const panel = document.createElement('div');\n
      \       panel.id = 'um-debug-panel';\n        panel.style.cssText = `\n            position:
      fixed;\n            bottom: 10px;\n            right: 10px;\n            background:
      yellow;\n            border: 3px solid red;\n            padding: 15px;\n            z-index:
      2147483647;\n            font-family: monospace;\n            font-size: 12px;\n
      \           max-width: 400px;\n            max-height: 300px;\n            overflow-y:
      auto;\n            box-shadow: 0 0 20px rgba(0,0,0,0.5);\n        `;\n        panel.innerHTML
      = `\n            <h3 style=\"margin: 0 0 10px 0; color: red;\">USER MGT DEBUG
      PANEL</h3>\n            <div id=\"um-debug-content\" style=\"background: white;
      padding: 5px; border: 1px solid black;\"></div>\n            <button onclick=\"window.testSettingsClick()\"
      style=\"margin-top: 10px; padding: 5px; background: red; color: white; border:
      none; cursor: pointer;\">\n                TEST CLICK SETTINGS\n            </button>\n
      \       `;\n\n        if (document.body) {\n            document.body.appendChild(panel);\n
      \       }\n        return panel;\n    }\n\n    // Log to both console and visible
      panel\n    function debugLog(message, isError = false) {\n        console.log(DEBUG_PREFIX,
      DEBUG_STYLE, message);\n        const content = document.getElementById('um-debug-content');\n
      \       if (content) {\n            const time = new Date().toISOString().split('T')[1].split('.')[0];\n
      \           const color = isError ? 'red' : 'black';\n            content.innerHTML
      += `<div style=\"color: ${color}; margin: 2px 0;\">${time}: ${message}</div>`;\n
      \           content.scrollTop = content.scrollHeight;\n        }\n    }\n\n
      \   // Wait for body to exist\n    function waitForBody(callback) {\n        if
      (document.body) {\n            callback();\n        } else {\n            setTimeout(()
      => waitForBody(callback), 50);\n        }\n    }\n\n    // Main function to
      find and attach to Settings\n    function findAndAttachSettings() {\n        debugLog('Starting
      Settings search...');\n\n        let attempts = 0;\n        const maxAttempts
      = 30;\n\n        const searchInterval = setInterval(() => {\n            attempts++;\n
      \           debugLog(`Attempt ${attempts}/${maxAttempts}`);\n\n            //
      Count elements\n            const buttons = document.querySelectorAll('button');\n
      \           const svgs = document.querySelectorAll('svg');\n            debugLog(`Found
      ${buttons.length} buttons, ${svgs.length} SVGs`);\n\n            // Look for
      Settings button specifically\n            let settingsButton = null;\n\n            //
      Method 1: Find lucide-settings SVG\n            const lucideSettings = document.querySelector('svg.lucide-settings,
      svg.lucide.lucide-settings');\n            if (lucideSettings) {\n                settingsButton
      = lucideSettings.closest('button');\n                if (settingsButton) {\n
      \                   debugLog('✓ Found via lucide-settings SVG!');\n                }\n
      \           }\n\n            // Method 2: Find by text content\n            if
      (!settingsButton) {\n                const buttonsArray = Array.from(buttons);\n
      \               settingsButton = buttonsArray.find(btn =>\n                    btn.textContent?.toLowerCase().includes('settings')
      ||\n                    btn.textContent?.toLowerCase().includes('setting')\n
      \               );\n                if (settingsButton) {\n                    debugLog('✓
      Found via text content!');\n                }\n            }\n\n            //
      Method 3: Find by aria-label\n            if (!settingsButton) {\n                settingsButton
      = document.querySelector('button[aria-label*=\"setting\" i], button[title*=\"setting\"
      i]');\n                if (settingsButton) {\n                    debugLog('✓
      Found via aria-label/title!');\n                }\n            }\n\n            if
      (settingsButton) {\n                debugLog('SUCCESS! Settings button found!',
      false);\n                debugLog(`Button: ${settingsButton.tagName}, class:
      ${settingsButton.className}`);\n\n                // Add visual indicator\n
      \               settingsButton.style.border = '3px solid red';\n                settingsButton.style.boxShadow
      = '0 0 10px red';\n\n                // Clone and replace to remove existing
      handlers\n                const newButton = settingsButton.cloneNode(true);\n\n
      \               // Add our click handler\n                newButton.addEventListener('click',
      function(e) {\n                    debugLog('\U0001F3AF SETTINGS CLICKED!',
      false);\n                    alert('User Management: Settings button clicked
      successfully!');\n                    console.log('Settings click event:', e);\n\n
      \                   // Load main script if needed\n                    if (!window.UserManagementMainLoaded)
      {\n                        debugLog('Loading main user management script...');\n
      \                       const script = document.createElement('script');\n                        script.src
      = '/user-management.js';\n                        script.onload = () => {\n
      \                           debugLog('Main script loaded!');\n                            window.UserManagementMainLoaded
      = true;\n                        };\n                        script.onerror
      = () => {\n                            debugLog('Failed to load main script!',
      true);\n                        };\n                        document.head.appendChild(script);\n
      \                   }\n                }, true);\n\n                settingsButton.parentNode.replaceChild(newButton,
      settingsButton);\n                debugLog('Click handler attached!');\n\n                //
      Store reference\n                window.SettingsButtonFound = newButton;\n\n
      \               clearInterval(searchInterval);\n                return;\n            }\n\n
      \           if (attempts >= maxAttempts) {\n                debugLog(`FAILED
      after ${maxAttempts} attempts!`, true);\n                debugLog('Dumping page
      info...', true);\n\n                // List all buttons for debugging\n                buttons.forEach((btn,
      i) => {\n                    if (i < 5) { // Only first 5\n                        console.log(`Button
      ${i}:`, btn, 'Text:', btn.textContent?.substring(0, 30));\n                    }\n
      \               });\n\n                clearInterval(searchInterval);\n            }\n
      \       }, 1000);\n    }\n\n    // Test function exposed globally\n    window.testSettingsClick
      = function() {\n        debugLog('Manual test triggered');\n        if (window.SettingsButtonFound)
      {\n            window.SettingsButtonFound.click();\n        } else {\n            const
      btn = document.querySelector('svg.lucide-settings')?.closest('button');\n            if
      (btn) {\n                debugLog('Found button manually, clicking...');\n                btn.click();\n
      \           } else {\n                alert('Settings button not found yet!');\n
      \           }\n        }\n    };\n\n    // Start everything\n    waitForBody(()
      => {\n        createDebugPanel();\n        debugLog('Debug panel created');\n
      \       debugLog('Waiting 2 seconds for React to render...');\n        setTimeout(()
      => {\n            findAndAttachSettings();\n        }, 2000);\n    });\n\n    //
      Also expose manual restart\n    window.restartUserManagementDebug = function()
      {\n        debugLog('Manual restart triggered');\n        findAndAttachSettings();\n
      \   };\n\n})();"
