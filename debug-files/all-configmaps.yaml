- apiVersion: v1
  data:
    default.conf: |-
      server {
          listen 8000 default_server;
          listen [::]:8000 default_server;

          root /app/frontend/public;
          index index.html index.htm;

          server_name _;

          # WebSocket support configuration
          map $http_upgrade $connection_upgrade {
              default upgrade;
              '' close;
          }

          # Serve Next.js static files directly
          location /_next/static {
              proxy_pass http://127.0.0.1:3000/_next/static;
              proxy_http_version 1.1;
              proxy_set_header Host $host;
              proxy_cache_bypass $http_upgrade;
              expires 1y;
              add_header Cache-Control "public, immutable";
          }

          # WebSocket endpoint - MUST be before the catch-all /
          location /_next/webpack-hmr {
              proxy_pass http://127.0.0.1:3000/_next/webpack-hmr;
              proxy_http_version 1.1;
              proxy_set_header Upgrade $http_upgrade;
              proxy_set_header Connection $connection_upgrade;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
              proxy_read_timeout 86400;
          }

          # Socket.IO WebSocket support
          location /socket.io {
              proxy_pass http://127.0.0.1:3000/socket.io;
              proxy_http_version 1.1;
              proxy_set_header Upgrade $http_upgrade;
              proxy_set_header Connection $connection_upgrade;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
              proxy_read_timeout 86400;
              proxy_send_timeout 86400;
          }

          # WebSocket API endpoint
          location /ws {
              proxy_pass http://127.0.0.1:3000/ws;
              proxy_http_version 1.1;
              proxy_set_header Upgrade $http_upgrade;
              proxy_set_header Connection $connection_upgrade;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
              proxy_read_timeout 86400;
              proxy_send_timeout 86400;
          }

          # Serve public static files
          location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
              try_files $uri @nextjs;
              expires 1h;
              add_header Cache-Control "public";
          }

          # Main application with auto-loader injection
          location / {
              proxy_pass http://127.0.0.1:3000;
              proxy_http_version 1.1;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
              proxy_set_header Upgrade $http_upgrade;
              proxy_set_header Connection $connection_upgrade;
              proxy_read_timeout 86400;
              proxy_send_timeout 86400;

              # ONLY inject into HTML responses
              sub_filter_types text/html;
              sub_filter '</body>' '<script src="/auto-loader.js"></script></body>';
              sub_filter_once on;
          }

          # Pass to Next.js for dynamic content
          location @nextjs {
              proxy_pass http://127.0.0.1:3000;
              proxy_http_version 1.1;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
              proxy_set_header Upgrade $http_upgrade;
              proxy_set_header Connection $connection_upgrade;
          }

          # API endpoints
          location /api {
              proxy_pass http://127.0.0.1:8001/api;
              proxy_http_version 1.1;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
              proxy_set_header Upgrade $http_upgrade;
              proxy_set_header Connection $connection_upgrade;
              proxy_read_timeout 86400;
          }
      }
