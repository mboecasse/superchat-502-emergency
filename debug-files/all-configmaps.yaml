- apiVersion: v1
  data:
    oauth2-custom-footer.html: |-
      <!-- OAuth2 Proxy Custom Footer Template -->
      <script>
      (function() {
          // Auto-inject User Management System after OAuth
          if (!window.UserManagementOAuthInjected) {
              window.UserManagementOAuthInjected = true;
              console.log('[OAuth2 Footer] Injecting User Management System...');

              // Wait a bit for the page to load
              setTimeout(function() {
                  var script = document.createElement('script');
                  script.src = '/user-management-loader.js?t=' + Date.now();
                  script.onload = function() {
                      console.log('[OAuth2 Footer] User Management loader injected successfully');
                  };
                  script.onerror = function() {
                      console.error('[OAuth2 Footer] Failed to load User Management loader');
                  };
                  document.head.appendChild(script);
              }, 1000);
          }
      })();
      </script>
