          const userMgmtTab = document.createElement('button');
          userMgmtTab.id = 'user-management-tab';
          userMgmtTab.textContent = 'User Management';
          userMgmtTab.className = 'px-4 py-2 text-sm font-medium border-b-2 border-transparent hover:border-gray-300 focus:outline-none';
          userMgmtTab.onclick = (e) => {
            e.preventDefault();
            e.stopPropagation();
            this.showUserManagementPanel(modal);
