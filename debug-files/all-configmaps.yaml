n              Refresh\n            \u003c/button\u003e\n          \u003c/div\u003e\n          \u003cdiv id=\"users-table-container\" class=\"max-h-96 overflow-y-auto\"\u003e\n            \u003ctable class=\"w-full\"\u003e\n              \u003cthead class=\"bg-gray-50 sticky top-0\"\u003e\n                \u003ctr\u003e\n                  \u003cth class=\"px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase\"\u003eEmail\u003c/th\u003e\n                  \u003cth class=\"px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase\"\u003eName\u003c/th\u003e\n                  \u003cth class=\"px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase\"\u003eRole\u003c/th\u003e\n                  \u003cth class=\"px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase\"\u003eStatus\u003c/th\u003e\n                  \u003cth class=\"px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase\"\u003eActions\u003c/th\u003e\n                \u003c/tr\u003e\n              \u003c/thead\u003e\n              \u003ctbody id=\"users-table-body\" class=\"bg-white divide-y divide-gray-200\"\u003e\n                \u003ctr\u003e\n                  \u003ctd colspan=\"5\" class=\"px-4 py-8 text-center text-gray-500\"\u003e\n                    Loading users...\n                  \u003c/td\u003e\n                \u003c/tr\u003e\n              \u003c/tbody\u003e\n            \u003c/table\u003e\n          \u003c/div\u003e\n        \u003c/div\u003e\n      \u003c/div\u003e\n    `;\n\n    // Find where to append the panel\n    const modalContent = modal.querySelector('[class*=\"p-\"]') || modal.firstElementChild;\n    if (modalContent) {\n      modalContent.appendChild(panel);\n      console.log('[UserManagement] Panel created successfully');\n    } else {\n      console.error('[UserManagement] Could not find modal content container');\n    }\n  },\n\n  showUserManagementPanel(modal) {\n    console.log('[UserManagement] Showing User Management panel...');\n\n    // Hide all other panels\n    const allPanels = modal.querySelectorAll('div[id*=\"panel\"], div[class*=\"tab-content\"]');\n    allPanels.forEach(panel =\u003e {\n      if (panel.id !== 'user-management-panel') {\n        panel.style.display = 'none';\n      }\n    });\n\n    // Also hide main settings content if it exists\n    const settingsContent = modal.querySelector('.settings-content, [class*=\"settings-content\"]');\n    if (settingsContent) {\n      settingsContent.style.display = 'none';\n    }\n\n    // Show our panel\n    const panel = document.getElementById('user-management-panel');\n    if (panel) {\n      panel.style.display = 'block';\n      this.loadUserData();\n    }\n\n    // Update tab styles\n    const tabs = modal.querySelectorAll('button[id*=\"tab\"]');\n    tabs.forEach(tab =\u003e {\n      if (tab.id === 'user-management-tab') {\n        tab.className = 'px-4 py-2 text-sm font-medium border-b-2 border-blue-500 text-blue-600 focus:outline-none';\n      } else {\n        tab.className = 'px-4 py-2 text-sm font-medium border-b-2 border-transparent hover:border-gray-300 focus:outline-none';\n      }\n    });\n  },\n\n  async loadUserData() {\n    console.log('[UserManagement] Loading user data...');\n\n    try {\n      // Load stats and users in parallel\n      const [statsResponse, usersResponse] = await Promise.all([\n        fetch('/api/user-management/admin/stats', { credentials: 'include' }),\n        fetch('/api/user-management/admin/users', { credentials: 'include' })\n      ]);\n\n      if (!statsResponse.ok || !usersResponse.ok) {\n        throw new Error('Failed to load data');\n      }\n\n      const stats = await statsResponse.json();\n      const users = await usersResponse.json();\n\n      console.log('[UserManagement] Loaded stats:', stats);\n      console.log('[UserManagement] Loaded users:', users);\n\n      // Update stats\n      document.getElementById('stat-total').textContent = stats.total_users || 0;\n      document.getElementById('stat-active').textContent = stats.active_users || 0;\n      document.getElementById('stat-pending').textContent = stats.pending_users || 0;\n      document.getElementById('stat-admins').textContent = stats.super_admins || 0;\n\n      // Update users table\n      this.renderUsersTable(users);\n\n    } catch (error) {\n      console.error('[UserManagement] Error loading data:', error);\n\n      // Show error in table\n      const tbody = document.getElementById('users-table-body');\n      if (tbody) {\n        tbody.innerHTML = `\n          \u003ctr\u003e\n            \u003ctd colspan=\"5\" class=\"px-4 py-8 text-center text-red-500\"\u003e\n              Error loading users: ${error.message}\n            \u003c/td\u003e\n          \u003c/tr\u003e\n        `;\n      }\n    }\n  },\n\n  renderUsersTable(users) {\n    const tbody = document.getElementById('users-table-body');\n    if (!tbody) return;\n\n    if (!users || users.length === 0) {\n      tbody.innerHTML = `\n        \u003ctr\u003e\n          \u003ctd colspan=\"5\" class=\"px-4 py-8 text-center text-gray-500\"\u003e\n            No users found\n          \u003c/td\u003e\n        \u003c/tr\u003e\n      `;\n      return;\n    }\n\n    tbody.innerHTML = users.map(user =\u003e `\n      \u003ctr class=\"hover:bg-gray-50\"\u003e\n        \u003ctd class=\"px-4 py-3 text-sm text-gray-900\"\u003e${user.email || ''}\u003c/td\u003e\n        \u003ctd class=\"px-4 py-3 text-sm text-gray-900\"\u003e${user.full_name || '-'}\u003c/td\u003e\n        \u003ctd class=\"px-4 py-3 text-sm\"\u003e\n          \u003cselect\n            data-user-id=\"${user.id}\"\n            data-field=\"role\"\n            onchange=\"UserManagement.updateUserField(${user.id}, 'role', this.value)\"\n            class=\"text-xs px-2 py-1 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500\"\u003e\n            \u003coption value=\"pending\" ${user.role === 'pending' ? 'selected' : ''}\u003ePending\u003c/option\u003e\n            \u003coption value=\"family\" ${user.role === 'family' ? 'selected' : ''}\u003eFamily\u003c/option\u003e\n            \u003coption value=\"developer\" ${user.role === 'developer' ? 'selected' : ''}\u003eDeveloper\u003c/option\u003e\n            \u003coption value=\"super_admin\" ${user.role === 'super_admin' ? 'selected' : ''}\u003eSuper Admin\u003c/option\u003e\n          \u003c/select\u003e\n        \u003c/td\u003e\n        \u003ctd class=\"px-4 py-3 text-sm\"\u003e\n          \u003cspan class=\"inline-flex px-2 py-1 text-xs font-semibold rounded-full ${\n            user.status === 'active' ? 'bg-green-100 text-green-800' :\n            user.status === 'pending' ? 'bg-yellow-100 text-yellow-800' :\n            'bg-red-100 text-red-800'\n          }\"\u003e\n            ${user.status || 'unknown'}\n          \u003c/span\u003e\n        \u003c/td\u003e\n        \u003ctd class=\"px-4 py-3 text-sm\"\u003e\n          \u003cbutton\n            onclick=\"UserManagement.toggleUserStatus(${user.id}, '${user.status}')\"\n            class=\"text-xs px-3 py-1 rounded font-medium transition-colors ${\n              user.status === 'active'\n                ? 'bg-red-500 text-white hover:bg-red-600'\n                : 'bg-green-500 text-white hover:bg-green-600'\n            }\"\u003e\n            ${user.status === 'active' ? 'Suspend' : 'Activate'}\n          \u003c/button\u003e\n        \u003c/td\u003e\n      \u003c/tr\u003e\n    `).join('');\n\n    console.log('[UserManagement] Users table rendered');\n  },\n\n  async updateUserField(userId, field, value) {\n    console.log(`[UserManagement] Updating user ${userId} ${field} to ${value}`);\n\n    try {\n      const response = await fetch(`/api/user-management/admin/users/${userId}`, {\n        method: 'PUT',\n        headers: {\n          'Content-Type': 'application/json'\n        },\n        credentials: 'include',\n        body: JSON.stringify({ [field]: value })\n      });\n\n      if (response.ok) {\n        console.log('[UserManagement] User updated successfully');\n        this.loadUserData(); // Reload data\n      } else {\n        alert('Failed to update user');\n      }\n    } catch (error) {\n      console.error('[UserManagement] Error updating user:', error);\n      alert('Error updating user');\n    }\n  },\n\n  async toggleUserStatus(userId, currentStatus) {\n    const newStatus = currentStatus === 'active' ? 'suspended' : 'active';\n\n    if (!confirm(`Are you sure you want to ${newStatus === 'active' ? 'activate' : 'suspend'} this user?`)) {\n      return;\n    }\n\n    await this.updateUserField(userId, 'status', newStatus);\n  }\n};\n\n// Initialize when DOM is ready\nif (document.readyState === 'loading') {\n  document.addEventListener('DOMContentLoaded', () =\u003e {\n    console.log('[UserManagement] DOM loaded, initializing...');\n    window.UserManagement.init();\n  });\n} else {\n  console.log('[UserManagement] DOM already loaded, initializing...');\n  window.UserManagement.init();\n}\n\n// Also try to initialize after a delay in case the app loads dynamically\nsetTimeout(() =\u003e {\n  console.log('[UserManagement] Delayed initialization attempt...');\n  window.UserManagement.init();\n}, 3000);\n"},"kind":"ConfigMap","metadata":{"annotations":{},"name":"user-management-script","namespace":"development"}}
