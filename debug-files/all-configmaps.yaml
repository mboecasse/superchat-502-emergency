- apiVersion: v1
  data:
    user-management-client.js: |
      // User Management Integration for SuperChat-Code Settings - FIXED VERSION
      console.log('[UserManagement] Script loaded at:', new Date().toISOString());

      window.UserManagement = {
        apiUrl: '/api/user-management',
        currentUser: null,
        initialized: false,

        async init() {
          if (this.initialized) {
            console.log('[UserManagement] Already initialized');
            return;
          }

          console.log('[UserManagement] Initializing...');
          this.initialized = true;

          // Multiple strategies to find Settings button
          const findSettingsButton = () => {
            let settingsButton = null;

            // Strategy 1: Find by SVG icon
            const settingsIcon = document.querySelector('svg.lucide-settings, svg[class*="settings"]');
            if (settingsIcon) {
              settingsButton = settingsIcon.closest('button');
              console.log('[UserManagement] Found by SVG icon:', settingsButton);
            }

            // Strategy 2: Find by aria-label
            if (!settingsButton) {
              settingsButton = document.querySelector('button[aria-label*="Settings" i], button[aria-label*="settings" i]');
              console.log('[UserManagement] Found by aria-label:', settingsButton);
            }

            // Strategy 3: Find by class
            if (!settingsButton) {
              settingsButton = document.querySelector('.settings-button, button.settings, [class*="settings-btn"]');
              console.log('[UserManagement] Found by class:', settingsButton);
            }

            // Strategy 4: Find by text content
            if (!settingsButton) {
              const buttons = document.querySelectorAll('button');
              settingsButton = Array.from(buttons).find(btn => {
                const text = btn.textContent || '';
                return text.toLowerCase().includes('settings') || text.toLowerCase().includes('preferences');
              });
              console.log('[UserManagement] Found by text:', settingsButton);
            }

            // Strategy 5: Look in sidebar or menu
            if (!settingsButton) {
              const containers = document.querySelectorAll('.sidebar, #sidebar, [class*="sidebar"], nav, .menu');
              for (const container of containers) {
                settingsButton = container.querySelector('button');
                if (settingsButton && (settingsButton.innerHTML.includes('settings') || settingsButton.innerHTML.includes('Settings'))) {
                  console.log('[UserManagement] Found in sidebar/menu:', settingsButton);
                  break;
                }
              }
            }

            return settingsButton;
          };

          // Try to find and enhance Settings button
          const attemptInit = () => {
            const settingsButton = findSettingsButton();

            if (settingsButton) {
              console.log('[UserManagement] Settings button found, enhancing...');
              this.enhanceSettingsButton(settingsButton);
            } else {
              console.log('[UserManagement] Settings button not found, will retry in 2 seconds...');
              setTimeout(attemptInit, 2000);
            }
          };

          attemptInit();
        },

        enhanceSettingsButton(button) {
          console.log('[UserManagement] Enhancing settings button...');

          // Remove any existing listeners to avoid duplicates
          const newButton = button.cloneNode(true);
          button.parentNode.replaceChild(newButton, button);

          // Add our click handler
          newButton.addEventListener('click', (e) => {
            console.log('[UserManagement] Settings button clicked!');

            // Wait a bit for modal to appear
            setTimeout(() => {
              this.injectUserManagement();
            }, 300);
          }, { capture: true });

          console.log('[UserManagement] Settings button enhanced successfully');
        },

        async injectUserManagement() {
          console.log('[UserManagement] Checking for modal and user permissions...');

          // First check if user has access
          const hasAccess = await this.checkUserAccess();
          if (!hasAccess) {
            console.log('[UserManagement] User does not have admin access');
            return;
          }

          // Find the modal
          const modal = this.findModal();
          if (!modal) {
            console.log('[UserManagement] Modal not found, retrying...');
            setTimeout(() => this.injectUserManagement(), 500);
            return;
          }

          console.log('[UserManagement] Modal found, injecting UI...');
          this.addUserManagementToModal(modal);
        },

        findModal() {
          // Try multiple selectors to find the settings modal
          const selectors = [
            '[role="dialog"]',
            '.modal',
            '.settings-modal',
            '.fixed.inset-0 > div',
            '[class*="modal"]',
            '.overlay > div'
          ];

          for (const selector of selectors) {
            const modal = document.querySelector(selector);
            if (modal && modal.offsetParent !== null) { // Check if visible
              console.log('[UserManagement] Modal found with selector:', selector);
              return modal;
            }
          }

          return null;
        },

        async checkUserAccess() {
          try {
            const response = await fetch('/api/user-management/admin/stats', {
              credentials: 'include',
              headers: {
                'Accept': 'application/json'
              }
            });

            if (response.ok) {
              const data = await response.json();
              console.log('[UserManagement] User has admin access, stats:', data);
              return true;
            }

            console.log('[UserManagement] Access check failed with status:', response.status);
            return false;
          } catch (error) {
            console.error('[UserManagement] Error checking access:', error);
            return false;
          }
        },

        addUserManagementToModal(modal) {
          // Check if already added
          if (modal.querySelector('#user-management-tab')) {
            console.log('[UserManagement] Tab already exists');
            return;
          }

          console.log('[UserManagement] Adding User Management tab...');

          // Find or create tab container
          let tabContainer = modal.querySelector('.tabs, nav, [role="tablist"], .border-b');

          if (!tabContainer) {
            // Look for any container with multiple buttons
            const buttonContainers = modal.querySelectorAll('div');
            for (const container of buttonContainers) {
              const buttons = container.querySelectorAll('button');
              if (buttons.length > 1) {
                tabContainer = container;
                break;
              }
