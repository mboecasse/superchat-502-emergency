        {"apiVersion":"v1","data":{"default.conf":"# WebSocket support configuration - MUST be outside server block\nmap $http_upgrade $connection_upgrade {\n    default upgrade;\n    '' close;\n}\n\nserver {\n    listen 8000 default_server;\n    listen [::]:8000 default_server;\n\n    root /app/frontend/public;\n    index index.html index.htm;\n\n    server_name _;\n\n    # Serve Next.js static files directly\n    location /_next/static {\n        proxy_pass http://127.0.0.1:3000/_next/static;\n        proxy_http_version 1.1;\n        proxy_set_header Host $host;\n        proxy_cache_bypass $http_upgrade;\n        expires 1y;\n        add_header Cache-Control \"public, immutable\";\n    }\n\n    # WebSocket endpoint - MUST be before the catch-all /\n    location /_next/webpack-hmr {\n        proxy_pass http://127.0.0.1:3000/_next/webpack-hmr;\n        proxy_http_version 1.1;\n        proxy_set_header Upgrade $http_upgrade;\n        proxy_set_header Connection \"upgrade\";\n        proxy_set_header Host $host;\n        proxy_set_header X-Real-IP $remote_addr;\n        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n        proxy_set_header X-Forwarded-Proto $scheme;\n        proxy_read_timeout 86400;\n    }\n\n    # Socket.IO WebSocket support\n    location /socket.io {\n        proxy_pass http://127.0.0.1:3000/socket.io;\n        proxy_http_version 1.1;\n        proxy_set_header Upgrade $http_upgrade;\n        proxy_set_header Connection \"upgrade\";\n        proxy_set_header Host $host;\n        proxy_set_header X-Real-IP $remote_addr;\n        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n        proxy_set_header X-Forwarded-Proto $scheme;\n        proxy_read_timeout 86400;\n        proxy_send_timeout 86400;\n    }\n\n    # WebSocket API endpoint\n    location /ws {\n        proxy_pass http://127.0.0.1:3000/ws;\n        proxy_http_version 1.1;\n        proxy_set_header Upgrade $http_upgrade;\n        proxy_set_header Connection \"upgrade\";\n        proxy_set_header Host $host;\n        proxy_set_header X-Real-IP $remote_addr;\n        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n        proxy_set_header X-Forwarded-Proto $scheme;\n        proxy_read_timeout 86400;\n        proxy_send_timeout 86400;\n    }\n\n    # Serve public static files\n    location ~* \\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {\n        try_files $uri @nextjs;\n        expires 1h;\n        add_header Cache-Control \"public\";\n    }\n\n    # Main application with auto-loader injection\n    location / {\n        proxy_pass http://127.0.0.1:3000;\n        proxy_http_version 1.1;\n        proxy_set_header Host $host;\n        proxy_set_header X-Real-IP $remote_addr;\n        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n        proxy_set_header X-Forwarded-Proto $scheme;\n        proxy_set_header Upgrade $http_upgrade;\n        proxy_set_header Connection \"upgrade\";\n        proxy_read_timeout 86400;\n        proxy_send_timeout 86400;\n\n        # ONLY inject into HTML responses\n        sub_filter_types text/html;\n        sub_filter '\u003c/body\u003e' '\u003cscript src=\"/auto-loader.js\"\u003e\u003c/script\u003e\u003c/body\u003e';\n        sub_filter_once on;\n    }\n\n    # Pass to Next.js for dynamic content\n    location @nextjs {\n        proxy_pass http://127.0.0.1:3000;\n        proxy_http_version 1.1;\n        proxy_set_header Host $host;\n        proxy_set_header X-Real-IP $remote_addr;\n        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n        proxy_set_header X-Forwarded-Proto $scheme;\n        proxy_set_header Upgrade $http_upgrade;\n        proxy_set_header Connection \"upgrade\";\n    }\n\n    # API endpoints\n    location /api {\n        proxy_pass http://127.0.0.1:8001/api;\n        proxy_http_version 1.1;\n        proxy_set_header Host $host;\n        proxy_set_header X-Real-IP $remote_addr;\n        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n        proxy_set_header X-Forwarded-Proto $scheme;\n        proxy_set_header Upgrade $http_upgrade;\n        proxy_set_header Connection \"upgrade\";\n        proxy_read_timeout 86400;\n    }\n}"},"kind":"ConfigMap","metadata":{"annotations":{},"creationTimestamp":null,"name":"nginx-ws-final","namespace":"development"}}
