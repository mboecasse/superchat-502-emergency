- apiVersion: v1
  data:
    user-management.js: |
      // User Management Integration for SuperChat-Code Settings
      class UserManagement {
        constructor() {
          this.apiUrl = '/api/user-management';
          this.currentUser = null;
          this.users = [];
          this.stats = {};
        }

        async init() {
          try {
            await this.loadCurrentUser();
            await this.loadStats();
            await this.loadUsers();
            this.injectSettingsPanel();
          } catch (error) {
            console.error('User management init failed:', error);
          }
        }

        async apiCall(endpoint, options = {}) {
          const response = await fetch(`${this.apiUrl}${endpoint}`, {
            ...options,
            headers: {
              'Content-Type': 'application/json',
              ...options.headers
            },
            credentials: 'include'
          });

          if (!response.ok) {
            throw new Error(`API call failed: ${response.statusText}`);
          }

          return response.json();
        }

        async loadCurrentUser() {
          try {
            // Get current user from OAuth headers
            const response = await fetch('/api/user-management/auth/me', {
              credentials: 'include'
            });
            if (response.ok) {
              this.currentUser = await response.json();
            }
          } catch (error) {
            console.warn('Could not load current user:', error);
          }
        }

        async loadUsers() {
          if (!this.currentUser || this.currentUser.role !== 'super_admin') {
            return;
          }

          try {
            this.users = await this.apiCall('/admin/users');
          } catch (error) {
            console.error('Failed to load users:', error);
          }
        }

        async loadStats() {
          if (!this.currentUser || this.currentUser.role !== 'super_admin') {
            return;
          }

          try {
            this.stats = await this.apiCall('/admin/stats');
          } catch (error) {
            console.error('Failed to load stats:', error);
          }
        }

        injectSettingsPanel() {
          // Wait for the settings modal to exist
          const checkForSettings = () => {
            const settingsButton = document.querySelector('[data-testid="settings-button"], .settings-button, button[aria-label*="settings" i]');
            if (settingsButton) {
              this.enhanceSettingsModal();
            } else {
              setTimeout(checkForSettings, 1000);
            }
          };
          checkForSettings();
        }

        enhanceSettingsModal() {
          // Find the settings modal/panel
          const settingsModal = document.querySelector('.settings-modal, .settings-panel, [role="dialog"]');

          if (!settingsModal) {
            // Create settings enhancement when modal opens
            this.observeSettingsModal();
            return;
          }

          this.addUserManagementTab(settingsModal);
        }

        observeSettingsModal() {
          const observer = new MutationObserver((mutations) => {
            mutations.forEach((mutation) => {
              mutation.addedNodes.forEach((node) => {
                if (node.nodeType === 1 && (
                  node.classList?.contains('settings-modal') ||
                  node.querySelector?.('.settings-modal') ||
                  node.getAttribute?.('role') === 'dialog'
                )) {
                  this.addUserManagementTab(node);
                }
              });
            });
          });

          observer.observe(document.body, {
            childList: true,
            subtree: true
          });
        }

        addUserManagementTab(settingsContainer) {
          if (!this.currentUser || this.currentUser.role !== 'super_admin') {
            return;
          }

          // Check if already added
          if (settingsContainer.querySelector('#user-management-tab')) {
            return;
          }

          // Find tabs container or create one
          let tabsContainer = settingsContainer.querySelector('.settings-tabs, .tab-list, nav');
          let contentContainer = settingsContainer.querySelector('.settings-content, .tab-content, .modal-body');

          if (!tabsContainer) {
            // Create tabs structure if it doesn't exist
            const settingsContent = settingsContainer.querySelector('.settings-content') || settingsContainer;

            tabsContainer = document.createElement('div');
            tabsContainer.className = 'border-b border-gray-200 mb-4';
            tabsContainer.innerHTML = `
              <nav class="flex space-x-8">
                <button class="settings-tab active py-2 px-1 border-b-2 border-blue-500 text-blue-600 font-medium text-sm"
                        data-tab="general">General</button>
                <button class="settings-tab py-2 px-1 border-b-2 border-transparent text-gray-500 hover:text-gray-700 font-medium text-sm"
                        data-tab="user-management" id="user-management-tab">User Management</button>
              </nav>
            `;

            contentContainer = document.createElement('div');
            contentContainer.className = 'settings-content';

            settingsContent.insertBefore(tabsContainer, settingsContent.firstChild);
            settingsContent.appendChild(contentContainer);
          } else {
            // Add user management tab to existing tabs
            const userMgmtTab = document.createElement('button');
            userMgmtTab.id = 'user-management-tab';
            userMgmtTab.className = 'settings-tab py-2 px-1 border-b-2 border-transparent text-gray-500 hover:text-gray-700 font-medium text-sm';
            userMgmtTab.setAttribute('data-tab', 'user-management');
            userMgmtTab.textContent = 'User Management';
            tabsContainer.appendChild(userMgmtTab);
          }

          // Add user management content
          this.addUserManagementContent(contentContainer);

          // Add tab switching functionality
          this.setupTabSwitching(settingsContainer);
        }

        addUserManagementContent(container) {
          const userMgmtContent = document.createElement('div');
          userMgmtContent.id = 'user-management-content';
          userMgmtContent.className = 'tab-content hidden';
          userMgmtContent.innerHTML = `
            <div class="space-y-6">
              <!-- Stats Cards -->
              <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
                <div class="bg-blue-50 rounded-lg p-4">
                  <h3 class="text-sm font-medium text-blue-700">Total Users</h3>
                  <p class="text-2xl font-bold text-blue-900" id="stat-total">${this.stats.total_users || 0}</p>
                </div>
                <div class="bg-green-50 rounded-lg p-4">
                  <h3 class="text-sm font-medium text-green-700">Active</h3>
                  <p class="text-2xl font-bold text-green-900" id="stat-active">${this.stats.active_users || 0}</p>
                </div>
                <div class="bg-orange-50 rounded-lg p-4">
                  <h3 class="text-sm font-medium text-orange-700">Pending</h3>
                  <p class="text-2xl font-bold text-orange-900" id="stat-pending">${this.stats.pending_users || 0}</p>
                </div>
                <div class="bg-purple-50 rounded-lg p-4">
                  <h3 class="text-sm font-medium text-purple-700">Developers</h3>
                  <p class="text-2xl font-bold text-purple-900" id="stat-developers">${this.stats.developers || 0}</p>
                </div>
              </div>

              <!-- Users Table -->
              <div class="bg-white border rounded-lg">
                <div class="px-4 py-3 border-b border-gray-200 flex justify-between items-center">
                  <h3 class="text-lg font-medium text-gray-900">Users</h3>
                  <button id="refresh-users" class="text-sm bg-blue-500 text-white px-3 py-1 rounded hover:bg-blue-600">
                    Refresh
                  </button>
                </div>
                <div class="overflow-x-auto">
                  <table class="w-full">
                    <thead class="bg-gray-50">
                      <tr>
                        <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">Email</th>
                        <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">Name</th>
                        <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">Role</th>
                        <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">Status</th>
                        <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">Actions</th>
                      </tr>
                    </thead>
                    <tbody id="users-table-body" class="divide-y divide-gray-200">
                      <!-- Users will be populated here -->
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          `;

          container.appendChild(userMgmtContent);
          this.populateUsersTable();
          this.setupUserManagementHandlers();
        }

        populateUsersTable() {
          const tbody = document.getElementById('users-table-body');
          if (!tbody) return;

          tbody.innerHTML = this.users.map(user => `
            <tr>
              <td class="px-4 py-2 text-sm text-gray-900">${user.email}</td>
              <td class="px-4 py-2 text-sm text-gray-900">${user.full_name || '-'}</td>
              <td class="px-4 py-2">
                <select class="user-role text-sm border rounded px-2 py-1" data-user-id="${user.id}">
                  <option value="pending" ${user.role === 'pending' ? 'selected' : ''}>Pending</option>
                  <option value="family" ${user.role === 'family' ? 'selected' : ''}>Family</option>
                  <option value="developer" ${user.role === 'developer' ? 'selected' : ''}>Developer</option>
                  <option value="super_admin" ${user.role === 'super_admin' ? 'selected' : ''}>Super Admin</option>
                </select>
              </td>
              <td class="px-4 py-2">
                <select class="user-status text-sm border rounded px-2 py-1" data-user-id="${user.id}">
                  <option value="pending" ${user.status === 'pending' ? 'selected' : ''}>Pending</option>
                  <option value="active" ${user.status === 'active' ? 'selected' : ''}>Active</option>
                  <option value="suspended" ${user.status === 'suspended' ? 'selected' : ''}>Suspended</option>
                </select>
              </td>
              <td class="px-4 py-2">
                <button class="delete-user text-xs bg-red-500 text-white px-2 py-1 rounded hover:bg-red-600"
                        data-user-id="${user.id}"
                        ${user.id === this.currentUser?.id ? 'disabled' : ''}>
                  Delete
                </button>
              </td>
            </tr>
          `).join('');
        }

        setupUserManagementHandlers() {
          // Refresh button
          document.getElementById('refresh-users')?.addEventListener('click', async () => {
            await this.loadUsers();
            await this.loadStats();
            this.populateUsersTable();
            this.updateStats();
          });

          // User role/status changes
          document.addEventListener('change', async (e) => {
            if (e.target.classList.contains('user-role') || e.target.classList.contains('user-status')) {
              const userId = e.target.getAttribute('data-user-id');
              const user = this.users.find(u => u.id == userId);

              if (!user) return;

              if (e.target.classList.contains('user-role')) {
                user.role = e.target.value;
              } else {
                user.status = e.target.value;
              }

              try {
                await this.apiCall(`/admin/users/${userId}`, {
                  method: 'PUT',
                  body: JSON.stringify({
                    role: user.role,
                    status: user.status,
                    full_name: user.full_name
                  })
                });

                // Show success feedback
                this.showNotification('User updated successfully', 'success');
                await this.loadStats();
                this.updateStats();
              } catch (error) {
                console.error('Failed to update user:', error);
                this.showNotification('Failed to update user', 'error');
                // Revert change
                await this.loadUsers();
                this.populateUsersTable();
              }
            }
          });

          // Delete user
          document.addEventListener('click', async (e) => {
            if (e.target.classList.contains('delete-user')) {
              const userId = e.target.getAttribute('data-user-id');
              const user = this.users.find(u => u.id == userId);

              if (!user || user.id === this.currentUser?.id) return;

              if (!confirm(`Are you sure you want to delete ${user.email}?`)) return;

              try {
                await this.apiCall(`/admin/users/${userId}`, {
                  method: 'DELETE'
                });

                this.showNotification('User deleted successfully', 'success');
                await this.loadUsers();
                await this.loadStats();
                this.populateUsersTable();
                this.updateStats();
              } catch (error) {
                console.error('Failed to delete user:', error);
                this.showNotification('Failed to delete user', 'error');
              }
            }
          });
        }

        updateStats() {
          document.getElementById('stat-total').textContent = this.stats.total_users || 0;
          document.getElementById('stat-active').textContent = this.stats.active_users || 0;
          document.getElementById('stat-pending').textContent = this.stats.pending_users || 0;
          document.getElementById('stat-developers').textContent = this.stats.developers || 0;
        }

        setupTabSwitching(container) {
          const tabs = container.querySelectorAll('.settings-tab');
          const contents = container.querySelectorAll('.tab-content');

          tabs.forEach(tab => {
            tab.addEventListener('click', () => {
              const targetTab = tab.getAttribute('data-tab');

              // Update tab states
              tabs.forEach(t => {
                t.classList.remove('active', 'border-blue-500', 'text-blue-600');
                t.classList.add('border-transparent', 'text-gray-500');
              });

              tab.classList.add('active', 'border-blue-500', 'text-blue-600');
              tab.classList.remove('border-transparent', 'text-gray-500');

              // Update content visibility
              contents.forEach(content => {
                content.classList.add('hidden');
              });

              const targetContent = container.querySelector(`#${targetTab}-content`) ||
                                    container.querySelector(`[data-tab-content="${targetTab}"]`);
              if (targetContent) {
                targetContent.classList.remove('hidden');
              }
            });
          });
        }

        showNotification(message, type = 'info') {
          // Create or update notification
          let notification = document.getElementById('user-mgmt-notification');
          if (!notification) {
            notification = document.createElement('div');
            notification.id = 'user-mgmt-notification';
            notification.className = 'fixed top-4 right-4 px-4 py-2 rounded shadow-lg z-50';
            document.body.appendChild(notification);
          }

          const colors = {
            success: 'bg-green-500 text-white',
            error: 'bg-red-500 text-white',
            info: 'bg-blue-500 text-white'
          };

          notification.className = `fixed top-4 right-4 px-4 py-2 rounded shadow-lg z-50 ${colors[type]}`;
          notification.textContent = message;

          setTimeout(() => {
            notification.remove();
          }, 3000);
        }
      }

      // Initialize user management when DOM is ready
      document.addEventListener('DOMContentLoaded', () => {
        window.userManagement = new UserManagement();
        window.userManagement.init();
      });
