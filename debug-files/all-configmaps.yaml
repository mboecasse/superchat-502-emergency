- apiVersion: v1
  data:
    claude-cli.py: |-
      #!/usr/bin/env python3
      """
      Claude CLI - A command-line interface for AWS Bedrock Claude models
      Provides chat and code analysis capabilities using Claude Opus and Sonnet models
      """

      import os
      import sys
      import json
      import argparse
      import boto3
      from typing import Optional, Dict, Any
      import textwrap

      class ClaudeCLI:
          def __init__(self):
              self.bedrock_region = os.environ.get('BEDROCK_REGION', 'us-west-2')
              self.opus_model = os.environ.get('BEDROCK_MODEL_OPUS',
                  'arn:aws:bedrock:us-west-2:329599649426:inference-profile/us.anthropic.claude-opus-4-1-20250805-v1:0')
              self.sonnet_model = os.environ.get('BEDROCK_MODEL_SONNET',
                  'arn:aws:bedrock:us-west-2:329599649426:inference-profile/global.anthropic.claude-sonnet-4-20250514-v1:0')

              # Initialize Bedrock client
              self.bedrock = boto3.client(
                  service_name='bedrock-runtime',
                  region_name=self.bedrock_region
              )

          def chat(self, prompt: str, model: str = 'opus', max_tokens: int = 4096) -> str:
              """Send a chat message to Claude via Bedrock"""
              model_id = self.opus_model if model == 'opus' else self.sonnet_model

              # Format the request for Claude 3 models
              request = {
                  "anthropic_version": "bedrock-2023-05-31",
                  "max_tokens": max_tokens,
                  "messages": [
                      {
                          "role": "user",
                          "content": prompt
                      }
                  ],
                  "temperature": 0.7,
                  "top_p": 0.9
              }

              try:
                  response = self.bedrock.invoke_model(
                      modelId=model_id,
                      body=json.dumps(request),
                      contentType='application/json',
                      accept='application/json'
                  )

                  response_body = json.loads(response.get('body').read())
                  return response_body.get('content', [{}])[0].get('text', 'No response received')

              except Exception as e:
                  return f"Error calling Bedrock: {str(e)}"

          def analyze_code(self, file_path: str, model: str = 'sonnet') -> str:
              """Analyze code file using Claude"""
              try:
                  with open(file_path, 'r') as f:
                      code = f.read()

                  prompt = f"""Please analyze this code and provide:
      1. A brief summary of what the code does
      2. Any potential issues or improvements
      3. Code quality assessment

      Code from {file_path}:
      ```
      {code}
      ```"""

                  return self.chat(prompt, model=model, max_tokens=8192)

              except FileNotFoundError:
                  return f"Error: File '{file_path}' not found"
              except Exception as e:
                  return f"Error analyzing code: {str(e)}"

          def explain(self, topic: str, model: str = 'opus') -> str:
              """Get an explanation about a programming topic"""
              prompt = f"Please explain {topic} in a clear and concise way, with code examples if relevant."
              return self.chat(prompt, model=model)

          def fix(self, file_path: str, error: str, model: str = 'opus') -> str:
              """Get help fixing an error in code"""
              try:
                  with open(file_path, 'r') as f:
                      code = f.read()

                  prompt = f"""I'm getting this error in my code:
      Error: {error}

      Code from {file_path}:
      ```
      {code}
      ```

      Please help me fix this error and explain what was wrong."""

                  return self.chat(prompt, model=model, max_tokens=8192)

              except FileNotFoundError:
                  return f"Error: File '{file_path}' not found"
              except Exception as e:
                  return f"Error: {str(e)}"

      def main():
          parser = argparse.ArgumentParser(
              description='Claude CLI - AI assistant powered by AWS Bedrock',
              formatter_class=argparse.RawDescriptionHelpFormatter,
              epilog=textwrap.dedent('''
              Examples:
                claude chat "How do I create a React component?"
                claude analyze main.py
                claude explain "async/await in JavaScript"
                claude fix app.js "undefined is not a function"
                claude --model sonnet chat "Quick question about Python"
              ''')
          )

          parser.add_argument('--version', action='version', version='Claude CLI 1.0.0 (AWS Bedrock)')
          parser.add_argument('--model', choices=['opus', 'sonnet'], default='opus',
                             help='Model to use (opus for complex tasks, sonnet for quick responses)')

          subparsers = parser.add_subparsers(dest='command', help='Commands')

          # Chat command
          chat_parser = subparsers.add_parser('chat', help='Chat with Claude')
          chat_parser.add_argument('prompt', help='Your message to Claude')
          chat_parser.add_argument('--max-tokens', type=int, default=4096, help='Maximum response tokens')

          # Analyze command
          analyze_parser = subparsers.add_parser('analyze', help='Analyze a code file')
          analyze_parser.add_argument('file', help='Path to file to analyze')

          # Explain command
          explain_parser = subparsers.add_parser('explain', help='Get explanation about a topic')
          explain_parser.add_argument('topic', help='Topic to explain')

          # Fix command
          fix_parser = subparsers.add_parser('fix', help='Get help fixing an error')
          fix_parser.add_argument('file', help='Path to file with error')
          fix_parser.add_argument('error', help='Error message or description')

          # Test command
          test_parser = subparsers.add_parser('test', help='Test Bedrock connectivity')

          args = parser.parse_args()

          if not args.command:
              parser.print_help()
              return

          cli = ClaudeCLI()

          if args.command == 'chat':
              print(cli.chat(args.prompt, model=args.model, max_tokens=args.max_tokens))
          elif args.command == 'analyze':
              print(cli.analyze_code(args.file, model=args.model))
          elif args.command == 'explain':
              print(cli.explain(args.topic, model=args.model))
          elif args.command == 'fix':
              print(cli.fix(args.file, args.error, model=args.model))
          elif args.command == 'test':
              print("Testing Bedrock connectivity...")
              response = cli.chat("Hello, Claude! Please respond with 'Connection successful!'", model='sonnet', max_tokens=50)
              print(response)
              if "successful" in response.lower():
                  print("\n✅ Bedrock connection test passed!")
              else:
                  print("\n❌ Bedrock connection test failed. Check IAM permissions.")

      if __name__ == '__main__':
          main()
