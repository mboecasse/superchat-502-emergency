Strategy 5: Look in sidebar or menu\n      if (!settingsButton) {\n        const containers = document.querySelectorAll('.sidebar, #sidebar, [class*=\"sidebar\"], nav, .menu');\n        for (const container of containers) {\n          settingsButton = container.querySelector('button');\n          if (settingsButton \u0026\u0026 (settingsButton.innerHTML.includes('settings') || settingsButton.innerHTML.includes('Settings'))) {\n            console.log('[UserManagement] Found in sidebar/menu:', settingsButton);\n            break;\n          }\n        }\n      }\n\n      return settingsButton;\n    };\n\n    // Try to find and enhance Settings button\n    const attemptInit = () =\u003e {\n      const settingsButton = findSettingsButton();\n\n      if (settingsButton) {\n        console.log('[UserManagement] Settings button found, enhancing...');\n        this.enhanceSettingsButton(settingsButton);\n      } else {\n        console.log('[UserManagement] Settings button not found, will retry in 2 seconds...');\n        setTimeout(attemptInit, 2000);\n      }\n    };\n\n    attemptInit();\n  },\n\n  enhanceSettingsButton(button) {\n    console.log('[UserManagement] Enhancing settings button...');\n\n    // Remove any existing listeners to avoid duplicates\n    const newButton = button.cloneNode(true);\n    button.parentNode.replaceChild(newButton, button);\n\n    // Add our click handler\n    newButton.addEventListener('click', (e) =\u003e {\n      console.log('[UserManagement] Settings button clicked!');\n\n      // Wait a bit for modal to appear\n      setTimeout(() =\u003e {\n        this.injectUserManagement();\n      }, 300);\n    }, { capture: true });\n\n    console.log('[UserManagement] Settings button enhanced successfully');\n  },\n\n  async injectUserManagement() {\n    console.log('[UserManagement] Checking for modal and user permissions...');\n\n    // First check if user has access\n    const hasAccess = await this.checkUserAccess();\n    if (!hasAccess) {\